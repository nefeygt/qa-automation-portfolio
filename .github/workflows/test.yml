name: QA Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest pytest-html webdriver-manager requests pyyaml
        
    - name: Create directories
      run: |
        mkdir -p reports/screenshots
        
    - name: Run tests
      run: |
        pytest tests/test_parallel.py tests/test_search.py api_tests/test_github_api.py api_tests/test_github_advanced.py --html=reports/test_report.html --self-contained-html
        
    - name: Upload test report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-report
        path: |
          reports/test_report.html
          reports/screenshots/